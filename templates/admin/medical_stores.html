{% extends "base.html" %}
{% block title %}Admin · Gangoh Medical Stores{% endblock %}
{% block content %}
<div class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h3 mb-1">Gangoh Medical Stores</h1><p class="text-muted mb-0">Admin directory management</p></div><button class="btn btn-primary" id="newStore">Add store</button></div>
<div id="notice" class="small mb-3" role="status"></div>
<form id="storeForm" class="card card-body mb-4 d-none"><input id="storeId" type="hidden"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Store name *</label><input class="form-control" id="name" required></div><div class="col-md-6"><label class="form-label">Address *</label><input class="form-control" id="address" required></div>
<div class="col-md-4"><label class="form-label">Phone</label><input class="form-control" id="phone" placeholder="Leave blank if unknown"></div><div class="col-md-4"><label class="form-label">Latitude</label><input type="number" step="any" class="form-control" id="latitude" placeholder="Leave blank if unknown"></div><div class="col-md-4"><label class="form-label">Longitude</label><input type="number" step="any" class="form-control" id="longitude" placeholder="Leave blank if unknown"></div>
<div class="col-md-6"><label class="form-label">Opening hours</label><input class="form-control" id="opening_hours" placeholder="Leave blank if unknown"></div><div class="col-md-6"><label class="form-label">Data source *</label><input class="form-control" id="source" required placeholder="Admin confirmation, source URL, etc."></div>
<div class="col-12"><label class="form-label">Source record ID (optional, for import deduplication)</label><input class="form-control" id="source_id"></div><div class="col-12 form-check ms-2"><input type="checkbox" class="form-check-input" id="verified"><label class="form-check-label" for="verified">Mark details as verified (only after confirmation)</label></div>
</div><div class="mt-3"><button class="btn btn-primary" type="submit">Save</button> <button class="btn btn-outline-secondary" id="cancelEdit" type="button">Cancel</button></div></form>
<div id="storeRows" class="row g-3"></div></div>
{% endblock %}
{% block extra_scripts %}
<script>
(()=>{const token=()=>window.Auth?.getToken?.();const headers=()=>({'Content-Type':'application/json',...(token()?{Authorization:`Bearer ${token()}`}:{})});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const form=document.getElementById('storeForm'),notice=document.getElementById('notice');async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers(),...(opts.headers||{})}}),j=await r.json();if(!r.ok)throw Error(j.message||'Request failed');return j.data}
async function load(){try{const data=await api('/api/medical-stores/');document.getElementById('storeRows').innerHTML=data.stores.map(s=>`<div class="col-lg-6"><article class="card card-body h-100"><div class="d-flex justify-content-between"><h2 class="h5">${esc(s.name)}</h2><span class="badge ${s.verified?'bg-success':'bg-warning text-dark'}">${s.verified?'Verified':'Unverified'}</span></div><p class="mb-1">${esc(s.address)}</p><p class="small text-muted">${[s.phone,s.latitude,s.longitude,s.opening_hours,s.source].filter(Boolean).map(esc).join(' · ')||'No optional details'}</p><div class="mt-auto"><button class="btn btn-sm btn-outline-primary" data-edit="${esc(s._id)}">Edit</button> <button class="btn btn-sm btn-outline-danger" data-delete="${esc(s._id)}">Delete</button></div></article></div>`).join('')||'<p class="text-muted">No stores listed yet. Add confirmed records when the initial source list is available.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(data.stores.find(s=>s._id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}catch(e){notice.className='text-danger small mb-3';notice.textContent=e.message}}
function edit(s){form.classList.remove('d-none');document.getElementById('storeId').value=s?._id||'';for(const k of ['name','address','phone','latitude','longitude','opening_hours','source','source_id'])document.getElementById(k).value=s?.[k]??'';document.getElementById('verified').checked=!!s?.verified;form.scrollIntoView({behavior:'smooth'})}
async function remove(id){if(!window.confirm('Delete this store from the directory?'))return;try{await api('/api/medical-stores/'+id,{method:'DELETE'});notice.className='text-success small mb-3';notice.textContent='Store deleted.';load()}catch(e){notice.className='text-danger small mb-3';notice.textContent=e.message}}
document.getElementById('newStore').onclick=()=>edit(null);document.getElementById('cancelEdit').onclick=()=>form.classList.add('d-none');form.onsubmit=async e=>{e.preventDefault();const id=document.getElementById('storeId').value;const payload={};for(const k of ['name','address','phone','latitude','longitude','opening_hours','source','source_id'])payload[k]=document.getElementById(k).value;payload.verified=document.getElementById('verified').checked;try{await api('/api/medical-stores/'+(id||''),{method:id?'PUT':'POST',body:JSON.stringify(payload)});form.classList.add('d-none');notice.className='text-success small mb-3';notice.textContent='Store saved.';load()}catch(e){notice.className='text-danger small mb-3';notice.textContent=e.message}};load()})();
</script>
{% endblock %}
